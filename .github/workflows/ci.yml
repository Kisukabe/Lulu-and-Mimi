name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-build:
    name: TypeCheck & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeCheck (TypeScript Lint)
        run: npm run lint

      - name: Build Frontend (Vite SPA)
        run: npm run build:frontend

      - name: Build Backend (Standalone Express)
        run: npm run build:backend

      - name: Build Monolith
        run: npm run build
